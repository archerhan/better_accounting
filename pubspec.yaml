name: better_accounting
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  logger: ^1.3.0
  bot_toast: ^4.0.4
  flutter_screenutil: ^5.8.4
  share_plus: ^7.0.2
  table_calendar: ^3.0.9
  decimal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_assets:
  assets_path: assets/
  output_path: lib/constants/
  filename: assets.dart