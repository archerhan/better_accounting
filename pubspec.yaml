name: better_accounting
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  logger: ^1.3.0
  bot_toast: ^4.0.4
  flutter_screenutil: ^5.8.4
  share_plus: ^7.0.2
  table_calendar: ^3.0.9
  decimal: ^2.3.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.0.15
  get_storage: ^2.1.1
  animated_bottom_navigation_bar: ^1.2.0
  soundpool: ^2.3.0
  date_format: ^2.0.7
  flutter_reorderable_grid_view: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  isar_generator: ^3.1.0+1
  build_runner:
  flutter_gen_runner:

flutter:
  uses-material-design: true
  assets:
    - assets/images/common/
    - assets/images/business/
    - assets/images/entertainment/
    - assets/images/family/
    - assets/images/food/
    - assets/images/income/
    - assets/images/medical/
    - assets/images/others/
    - assets/images/shopping/
    - assets/images/skill/
    - assets/images/sport/
    - assets/images/traffic/
    - assets/json/

flutter_gen:
  output: lib/constants/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  # integrations:
  #   flutter_svg: true
  #   flare_flutter: true
  #   rive: true
  #   lottie: true

  # colors:
  #   inputs:
  #     - assets/color/colors.xml