name: better_accounting
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  logger: ^2.6.2
  bot_toast: ^4.0.4
  flutter_screenutil: ^5.9.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  get_storage: ^2.1.1
  animated_bottom_navigation_bar: ^1.4.0
  intl: ^0.20.2
  flutter_grid_button: ^2.0.0
  expressions: ^0.2.5
  auto_size_text: ^3.0.0
  sliding_up_panel: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner:
  flutter_gen_runner:

flutter:
  uses-material-design: true
  assets:
    - assets/images/common/
    - assets/images/business/
    - assets/images/entertainment/
    - assets/images/family/
    - assets/images/food/
    - assets/images/income/
    - assets/images/medical/
    - assets/images/others/
    - assets/images/shopping/
    - assets/images/skill/
    - assets/images/sport/
    - assets/images/traffic/
    - assets/json/

flutter_gen:
  output: lib/constants/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  # integrations:
  #   flutter_svg: true
  #   flare_flutter: true
  #   rive: true
  #   lottie: true

  # colors:
  #   inputs:
  #     - assets/color/colors.xml
